[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyayamitra-backend"
version = "1.0.0"
description = "NyayaMitra Backend API — AI for Legal Assistance & Access"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "S", "T20"]
ignore = ["E501", "B008", "W", "F401", "E402", "S101", "S104", "S105", "S106", "S311", "S108", "T201", "S110", "S112"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
