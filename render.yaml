services:
  - type: web
    name: nyayamitra-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: USE_SQLITE_FALLBACK
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: PRIMARY_MODEL
        value: gemini-2.0-flash
      - key: FALLBACK_MODEL
        value: llama3-70b-8192
      - key: FAST_MODEL
        value: gemini-2.0-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
      - key: SECRET_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: ENABLE_PII_REDACTION
        value: "true"
